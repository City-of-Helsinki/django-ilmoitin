[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django_ilmoitin"
version = "0.7.1"
description = "Django app for sending notifications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "City of Helsinki", email = "dev@hel.fi"},
]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=5.2",
    "django-parler>=2.0",
    "django-anymail",
    "django-mailer",
    "jinja2",
]

[project.optional-dependencies]
graphql_api = [
    "graphene>=2.0",
    "graphene-django",
    "graphql-core<3,>=2.1",
    "graphql-relay<3,>=2",
]
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
]
all = ["django-ilmoitin[test,graphql_api]"]

[project.urls]
Homepage = "https://github.com/City-of-Helsinki/django-ilmoitin"

[tool.coverage.run]
source = ["django_ilmoitin"]
omit = ["**/migrations/*", "**/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["django_ilmoitin"]

[tool.hatch.envs.default]
dependencies = [
    "django~=5.2",
    "pre-commit",
]
features = ["all"]
python = "3.10"

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = [
    "pre-commit install",
    "pre-commit run -a",
]
manage = "tests/manage.py {args}"

[tool.hatch.envs.hatch-test]
features = ["all"]
matrix-name-format = "dj{value}"
parallel = false
randomize = true

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11"]
django = ["5.2"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14"]
django = ["5.2", "6.0"]

[tool.hatch.envs.hatch-test.overrides]
matrix.django.dependencies = [
    { value = "django~={matrix:django}" },
]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = "coverage report"

[tool.hatch.envs.hatch-uv]
dependencies = [
    "uv>=0.11.1",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = "."
norecursedirs = [
    "bower_components",
    "node_modules",
    ".git",
    ".idea",
    "test_app"
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE"
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
]

[tool.uv]
exclude-newer = "14 days"
